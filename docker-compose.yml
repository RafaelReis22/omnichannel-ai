# Infraestrutura de desenvolvimento local.
# Uso: docker compose up -d
# Produção NÃO usa este arquivo (docs/07-deploy.md).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnichannel-postgres
    environment:
      POSTGRES_DB: omnichannel
      POSTGRES_USER: omnichannel
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme-local-only}
    ports:
      # 5433 no host: máquinas de dev costumam ter um Postgres local no 5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnichannel -d omnichannel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: omnichannel-redis
    ports:
      # 6380 no host: idem para Redis local
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: omnichannel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: omnichannel
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme-local-only}
    ports:
      - "5672:5672"
      - "15672:15672" # painel de gestão: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
