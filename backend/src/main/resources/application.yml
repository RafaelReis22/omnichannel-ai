spring:
  application:
    name: omnichannel-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/omnichannel}
    username: ${DATABASE_USERNAME:omnichannel}
    password: ${DATABASE_PASSWORD:}

  jpa:
    # Flyway é dono do schema; Hibernate apenas valida — nunca altera.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:omnichannel}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        # Reentrega com backoff antes de parar na DLQ — nunca perder mensagem silenciosamente.
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
