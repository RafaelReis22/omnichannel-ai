spring:
  application:
    name: omnichannel-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/omnichannel}
    username: ${DATABASE_USERNAME:omnichannel}
    password: ${DATABASE_PASSWORD:}

  jpa:
    # Flyway é dono do schema; Hibernate apenas valida — nunca altera.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:omnichannel}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        # Reentrega com backoff antes de parar na DLQ — nunca perder mensagem silenciosamente.
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2

  threads:
    virtual:
      enabled: true

  ai:
    model:
      chat: anthropic
      embedding: openai
      # tipos não usados: sem eles o starter OpenAI exigiria a chave no boot
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-20250514
          max-tokens: 1024
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        # Flyway é o dono do schema (V8); dimensão = text-embedding-3-small
        initialize-schema: false
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW

app:
  channels:
    # AES-256 p/ credenciais de canal em repouso — gere com: openssl rand -base64 32
    credentials-key: ${CHANNEL_CREDENTIALS_KEY:}
  security:
    # Falha no startup se ausente — gere com: openssl rand -base64 64
    jwt-secret: ${JWT_SECRET:}
    # AES-256 p/ segredos TOTP em repouso — gere com: openssl rand -base64 32
    totp-encryption-key: ${TOTP_ENCRYPTION_KEY:}
    access-token-ttl: ${JWT_ACCESS_TTL_MINUTES:15}m
    refresh-token-ttl: ${JWT_REFRESH_TTL_DAYS:7}d
    rate-limit:
      # força bruta em auth (docs/06-seguranca.md)
      ip-limit: 20
      ip-window: 1m
      email-failure-limit: 5
      email-failure-window: 15m

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # honra X-Forwarded-For do load balancer da plataforma (docs/07-deploy.md)
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
