# Overrides do profile de teste (ativado pelo surefire no pom.xml).
# NUNCA criar um src/test/resources/application.yml|properties: arquivo com
# o nome base "application" SOMBREIA o application.yml principal inteiro
# (sem merge) — o OSIV religa e quebra o RLS; o guard do TenancyConfig
# falha o startup para denunciar exatamente isso.
app.channels.credentials-key=dGVzdGUtY2hhdmUtZGUtMzItYnl0ZXMtcGFyYS10c3Q=
app.security.jwt-secret=segredo-de-teste-nunca-usar-em-producao-0123456789
app.security.totp-encryption-key=dGVzdGUtY2hhdmUtZGUtMzItYnl0ZXMtcGFyYS10c3Q=
# limites altos: a suíte inteira compartilha o IP de loopback; o teste de
# rate limiting derruba via properties próprias
app.security.rate-limit.ip-limit=10000
app.security.rate-limit.ip-window=1m
app.security.rate-limit.email-failure-limit=10000
app.security.rate-limit.email-failure-window=15m
# IA: desliga os modelos reais; a porta AnswerGenerator e o EmbeddingModel
# são satisfeitos por fakes (TestcontainersConfiguration) — CI nunca chama LLM
spring.ai.model.chat=none
spring.ai.model.embedding=none
