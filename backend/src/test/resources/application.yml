# Configuração exclusiva de teste — nunca usada fora do surefire.
app:
  channels:
    # base64 de exatamente 32 bytes, valor de teste
    credentials-key: "dGVzdGUtY2hhdmUtZGUtMzItYnl0ZXMtcGFyYS10c3Q="
  security:
    jwt-secret: "segredo-de-teste-nunca-usar-em-producao-0123456789"
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    rate-limit:
      # alto por padrão: toda a suíte compartilha o mesmo IP de loopback;
      # o teste de rate limiting derruba os limites via properties próprias
      ip-limit: 10000
      ip-window: 1m
      email-failure-limit: 10000
      email-failure-window: 15m
